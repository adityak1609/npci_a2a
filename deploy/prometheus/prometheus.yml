global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mindgate-api
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets:
          - reverse-proxy:443
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/certs/tls_ca.crt
      server_name: mindgate.example.com
    relabel_configs:
      - target_label: service
        replacement: mindgate-policy-bot
