[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
namespace_packages = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

ignore_missing_imports = true
follow_imports = "normal"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
warn_return_any = false
disable_error_code = ["arg-type", "assignment", "return-value", "name-defined", "union-attr"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "database"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "pgvector.*",
    "fitz.*",
    "bcrypt",
    "jose.*",
    "watchdog.*",
    "redis.*",
    "psycopg2.*",
    "alembic.*",
    "prometheus_client.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    # Non-shipping helpers, local tooling, and the standalone mock agent are
    # excluded so the gate reflects coverage of the actual API surface.
    "tests/*",
    "alembic/*",
    "mock_npci_agent/*",
    "load_tests/*",
    "tools/*",
    "scripts/*",
    "inject_js.py",
    "refactor.py",
    "fix_schemas.py",
    "worker.py",
    "*/__init__.py",
]

[tool.coverage.report]
# Ratchet this floor upward as coverage improves; CI fails below it.
# Branch-coverage baseline is ~36% over the shipping API surface.
fail_under = 35
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
