name: CI

on:
  push:
  pull_request:

jobs:
  # ── Core: Test, Lint, Type-check ──────────────────────────────────────────
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: test-google-api-key
      SECRET_KEY: ssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssss
      A2A_HMAC_SECRET: hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh
      NPCI_API_KEY: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
      EXTERNAL_AI_DATA_PROCESSING_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run unit & integration tests
        run: python -m pytest -v --ignore=tests/integration

      # ── Type checking ──────────────────────────────────────────────────────
      - name: Type check (mypy)
        run: |
          python -m mypy \
            main.py auth.py guardrails.py a2a_auth.py \
            a2a_audit.py a2a_models.py a2a_state.py \
            config.py compliance.py metrics.py rate_limit.py \
            retriever.py ingest.py prompt.py csrf.py \
            secrets_loader.py file_validation.py \
            agent/ routes/ services/ ws/ \
            --config-file mypy.ini

      # ── Dependency vulnerability scan ──────────────────────────────────────
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on

      # ── SBOM generation ────────────────────────────────────────────────────
      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom.json --format json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: warn

      # ── Container image build & scan ───────────────────────────────────────
      - name: Build Docker image (immutable tag)
        run: docker build -t mindgate-policy-bot:${{ github.sha }} .

      - name: Scan image for CRITICAL CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mindgate-policy-bot:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  # ── SAST: Static Application Security Testing ─────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Required to upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/python
            p/flask
            p/fastapi
            p/owasp-top-ten
            p/sql-injection
          auditOn: push
          # Upload results to GitHub Advanced Security (SARIF)
          generateSarif: "1"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ── Secret Scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for Gitleaks

      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for org-level features
