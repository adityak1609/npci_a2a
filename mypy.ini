[mypy]
python_version = 3.11
# Explicit package bases so agent/, routes/, services/, ws/ are resolved
# correctly even when mypy is run from the project root.
explicit_package_bases = True
namespace_packages = True

# Import resolution
ignore_missing_imports = True
follow_imports = normal

# Type-checking strictness (tightened from previous defaults)
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True
# Suppress "Returning Any" noise from third-party code
warn_return_any = False

# ── Per-module overrides ──────────────────────────────────────────────────

# Test files — relax; they mock a lot
[mypy-tests.*]
ignore_errors = True

# Database models use dynamic SQLAlchemy patterns that mypy can't trace
[mypy-database]
ignore_errors = True

# Third-party packages without bundled type stubs
[mypy-google.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-pgvector.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-bcrypt]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True
