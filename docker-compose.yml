services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindgate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindgate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mindgate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
